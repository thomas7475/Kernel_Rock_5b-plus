name: Build kernel packages

# Automatically builds the kernel packages on GitHub's free arm64 hosted
# runners whenever a release tag (v<version> on main) or a dev tag
# (<version>-dev on dev) is pushed (or on a manual run). Dev tags are
# published as pre-releases.
#
# How it works:
#   1. The job runs directly on an ubuntu-24.04-arm runner (public repos
#      get these for free) and frees the disk space the runner images
#      waste on preinstalled toolchains we do not need (~10-15 GB).
#   2. The official Arch Linux ARM aarch64 rootfs from os.archlinuxarm.org
#      is imported into Docker -- makepkg needs an Arch userland, the
#      official archlinux images are amd64-only, and this way no
#      third-party container images are involved.
#   3. makepkg builds the packages from the PKGBUILD in this repository.
#   4. Tag builds also publish a GitHub Release with the packages.
#
# Requirements on the repository: it must be PUBLIC (private repos do not
# get the free arm64 runners) and Actions must be enabled (the default).
# No secrets are needed: the workflow only uses the automatically provided
# GITHUB_TOKEN, scoped to "contents: write" for the release job.

on:
  push:
    tags:
      - 'v*'      # release tags on main: v<kernel-version>
      - '*-dev'   # dev tags on dev: <kernel-version>-dev
  workflow_dispatch:

permissions:
  contents: read

env:
  ALARM_ROOTFS_URL: http://os.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz

jobs:
  build:
    name: makepkg on arm64 runner
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show runner info and free disk space
        run: |
          echo "== runner =="
          uname -a
          # This kernel must be compiled NATIVELY on aarch64 (the label
          # ubuntu-24.04-arm maps to GitHub's native arm64 hosted runners);
          # assert it so a misconfigured label can never produce cross-
          # compiled or emulated builds.
          [ "$(uname -m)" = "aarch64" ] \
            || { echo "::error::runner is $(uname -m), not native aarch64"; exit 1; }
          nproc
          free -h
          echo "== disk before cleanup =="
          df -h /
          # Remove preinstalled toolchains we do not need (~10-15 GB).
          # Best effort: none of them are required to build this kernel.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                       /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "== disk after cleanup =="
          df -h /

      - name: Download and import the official Arch Linux ARM rootfs
        run: |
          curl -fL --retry 3 --retry-delay 5 \
               -o "$RUNNER_TEMP/alarm-rootfs.tar.gz" "$ALARM_ROOTFS_URL"
          sha256sum "$RUNNER_TEMP/alarm-rootfs.tar.gz"
          docker import "$RUNNER_TEMP/alarm-rootfs.tar.gz" alarm-builder:latest
          rm -f "$RUNNER_TEMP/alarm-rootfs.tar.gz"

      - name: Build packages with makepkg
        run: |
          # Everything happens inside one container invocation: updating
          # the (rolling) rootfs, installing the build dependencies and
          # building, so the container layer is thrown away afterwards.
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            alarm-builder:latest bash -euxc '
              # pacman 7 confines itself with a Landlock ruleset and drops to
              # the "alpm" sandbox user; Docker seccomp blocks the Landlock
              # syscalls, so disable the sandbox inside this container.
              grep -q "^DisableSandbox" /etc/pacman.conf \
                || sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf

              # docker import does not leave the pacman keyring in a usable
              # state ("keyring is not writable"); regenerate it from the
              # keyring data shipped in the rootfs.
              rm -rf /etc/pacman.d/gnupg
              pacman-key --init
              pacman-key --populate archlinuxarm archlinux \
                || pacman-key --populate archlinuxarm

              # The ALARM mirrors occasionally stall mid-transfer; pacman
              # keeps completed downloads in its cache, so retrying only
              # re-fetches what is missing.
              retry() {
                for n in 1 2 3 4; do
                  "$@" && return 0
                  echo "== command failed, retry ${n}/4 in 15s =="
                  sleep 15
                done
                return 1
              }

              # Bring the rootfs up to date and install the build
              # dependencies. base-devel = the toolchain makepkg assumes
              # (gcc, make, ...); the rest = the PKGBUILD makedepends +
              # kernel build needs. rust-src is the Rust standard-library
              # sources: ALARM splits them out of the rust package, and
              # without them scripts/rust_is_available.sh fails, which
              # makes olddefconfig SILENTLY drop CONFIG_RUST=y (the build
              # then succeeds but ships no Rust artifacts at all -- see
              # the v7.3.b436759-1 / v7.4rc3.6a63eca-1 headers).
              retry pacman -Syu --noconfirm
              retry pacman -S --needed --noconfirm \
                base-devel git kmod bc dtc uboot-tools pahole python \
                rust rust-src rust-bindgen perl openssl libelf zstd
              pacman -Scc --noconfirm

              echo "== toolchain =="
              gcc --version | head -1
              rustc --version
              pacman -Q rust-src
              bindgen --version
              pahole --version

              # makepkg refuses to run as root; build as an unprivileged user.
              id builder >/dev/null 2>&1 || useradd -m builder
              chown -R builder:builder /repo
              export MAKEFLAGS="-j$(nproc)"
              # Build a makepkg config we fully control instead of editing
              # the system one: the rolling rootfs keeps changing it under
              # us (ALARM ships PKGEXT=.pkg.tar.xz; run 6: /etc/makepkg.conf
              # missing; run 7: not writable even as root). Copy whatever
              # the system provides, strip the settings we must control,
              # and pin them at the end. An empty base is fine too: makepkg
              # then uses its built-in defaults (.pkg.tar.zst, startdir).
              MAKEPKG_CONF=/tmp/makepkg.conf
              : > "$MAKEPKG_CONF"
              for _f in /etc/makepkg.conf /etc/makepkg.conf.d/*.conf; do
                [ -f "$_f" ] && cat "$_f" >> "$MAKEPKG_CONF" && echo >> "$MAKEPKG_CONF"
              done
              sed -i -e "s|^#*PKGDEST=.*||" -e "s|^#*PKGEXT=.*||" -e "s|^#*SRCEXT=.*||" \
                     -e "s|^#*STRIP_BINARIES=.*||" -e "s|^#*STRIP_SHARED=.*||" -e "s|^#*STRIP_STATIC=.*||" \
                     "$MAKEPKG_CONF"
              [ -s "$MAKEPKG_CONF" ] || { echo "CARCH=\"$(uname -m)\"" >> "$MAKEPKG_CONF"; echo "CFLAGS=\"-O2 -pipe\"" >> "$MAKEPKG_CONF"; echo "CXXFLAGS=\"-O2 -pipe\"" >> "$MAKEPKG_CONF"; }
              echo "PKGDEST=\"/repo\"" >> "$MAKEPKG_CONF"
              echo "PKGEXT=\".pkg.tar.zst\"" >> "$MAKEPKG_CONF"
              echo "SRCEXT=\".src.tar.gz\"" >> "$MAKEPKG_CONF"
              # Arch's strip flags (the _package-headers strip loop relies
              # on them; without a definition it would run a full strip).
              echo "STRIP_BINARIES=\"--strip-all\"" >> "$MAKEPKG_CONF"
              echo "STRIP_SHARED=\"--strip-unneeded\"" >> "$MAKEPKG_CONF"
              echo "STRIP_STATIC=\"--strip-unneeded\"" >> "$MAKEPKG_CONF"
              runuser -u builder -- makepkg --config "$MAKEPKG_CONF" -f --noconfirm

              # Load-bearing Rust verification: the headers package must
              # ship build/rust/libmacros.so (required by DKMS / out-of-tree
              # Rust module builds) and its .config must have CONFIG_RUST=y.
              # Both were missing from the pkgrel=1 packages because Kconfig
              # silently disables RUST when the toolchain is incomplete.
              hdr=$(ls /repo/*-headers-*.pkg.tar.zst)
              tar --zstd -tf "$hdr" | grep -q 'build/rust/libmacros.so' \
                || { echo "ERROR: $hdr does not contain rust/libmacros.so"; exit 1; }
              tar --zstd -xOf "$hdr" --wildcards '*/build/.config' \
                | grep -q '^CONFIG_RUST=y' \
                || { echo "ERROR: packaged kernel config lacks CONFIG_RUST=y"; exit 1; }
              echo "Rust artifacts verified in $hdr"
              # Safety net: copy any package that landed outside /repo
              # (e.g. via a config fragment) onto the mounted workspace
              # before the container exits.
              find / -xdev -name "*.pkg.tar.*" -not -path "/repo/*" \
                -not -path "/var/cache/*" -exec cp -v {} /repo/ \;
            '

      - name: Collect packages and checksums
        run: |
          mkdir -p dist
          find "$GITHUB_WORKSPACE" -maxdepth 2 -name "*.pkg.tar.*" \
            -exec cp -v {} dist/ \;
          cd dist
          echo "== artifacts found in workspace =="
          ls -la
          n=$(find . -maxdepth 1 -name "*.pkg.tar.*" | wc -l)
          [ "$n" -eq 2 ] || { echo "ERROR: expected exactly 2 packages, found $n"; exit 1; }
          sha256sum *.pkg.tar.* > SHA256SUMS
          cat SHA256SUMS

      - name: Upload packages as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-packages
          path: dist/
          if-no-files-found: error
          retention-days: 30
          # The packages are already zstd-compressed; do not compress again.
          compression-level: 0

  release:
    name: Publish GitHub Release (tag builds only)
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      # Allow the automatically provided GITHUB_TOKEN to create the release.
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: kernel-packages
          path: dist

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          cd dist
          # *.pkg.tar.* (not just zst) so a stray compression setting in a
          # future rootfs cannot make the release step lose the packages.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release for ${tag} already exists, uploading with --clobber"
            gh release upload "$tag" *.pkg.tar.* SHA256SUMS --clobber
            exit 0
          fi
          # Dev tags (<version>-dev) publish as pre-releases so they never
          # replace "latest"; release tags publish normally.
          if [[ "$tag" == *-dev ]]; then
            gh release create "$tag" --title "Kernel $tag (dev)" --prerelease \
              --generate-notes *.pkg.tar.* SHA256SUMS
          else
            gh release create "$tag" --title "Kernel $tag" --generate-notes \
              *.pkg.tar.* SHA256SUMS
          fi
